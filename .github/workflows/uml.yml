name: Generate UML Diagrams

on:
  push:
    paths:
      - '**.puml'
  workflow_dispatch:

jobs:
  generate-uml:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install librsvg2-bin, Graphviz and poppler-utils (for PDF and dot rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin graphviz poppler-utils

      - name: Download PlantUML
        run: |
          curl -L https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar \
            -o plantuml.jar

      - name: Create output directory
        run: mkdir -p docs/uml

      - name: Generate PNG from .puml files
        run: |
          find . -name "*.puml" \
            ! -path "./.git/*" \
            ! -path "./plantuml.jar" \
            | while read puml; do
              filename=$(basename "$puml" .puml)
              echo "Generating docs/uml/${filename}.png from ${puml}"
              java -jar plantuml.jar \
                -tpng \
                -charset UTF-8 \
                -o "$(pwd)/docs/uml" \
                "$puml"
            done

      - name: Generate combined UML PDF (one page per diagram)
        run: |
          svg_dir=$(mktemp -d)
          find . -name "*.puml" \
            ! -path "./.git/*" \
            | sort | while read puml; do
              echo "Rendering ${puml} to SVG"
              java -jar plantuml.jar \
                -tsvg \
                -charset UTF-8 \
                -o "$svg_dir" \
                "$puml"
            done
          for svg in "$svg_dir"/*.svg; do
            rsvg-convert -f pdf -o "${svg%.svg}.pdf" "$svg"
          done
          pdfunite "$svg_dir"/*.pdf UML.pdf

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain docs/uml/ UML.pdf)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push generated files
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/uml/ UML.pdf
          git commit -m "docs: auto-generate UML PNG and PDF diagrams [skip ci]"
          git push