name: Generate UML Diagrams

on:
  push:
    paths:
      - '**.puml'
  workflow_dispatch:

jobs:
  generate-uml:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install FOP (for PDF generation)
        run: |
          sudo apt-get update
          sudo apt-get install -y fop

      - name: Download PlantUML
        run: |
          curl -L https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar \
            -o plantuml.jar

      - name: Create output directory
        run: mkdir -p docs/uml

      - name: Generate PNG from .puml files
        run: |
          find . -name "*.puml" \
            ! -path "./.git/*" \
            ! -path "./plantuml.jar" \
            | while read puml; do
              filename=$(basename "$puml" .puml)
              echo "Generating docs/uml/${filename}.png from ${puml}"
              java -jar plantuml.jar \
                -tpng \
                -charset UTF-8 \
                -o "$(pwd)/docs/uml" \
                "$puml"
            done

      - name: Generate UML PDF at Root
        run: |
          java -jar plantuml.jar \
            -tpdf \
            -charset UTF-8 \
            -o "$(pwd)" \
            "./Assets/Scripts/BACKEND.puml"

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain docs/uml/ BACKEND.pdf)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push generated files
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/uml/ BACKEND.pdf
          git commit -m "docs: auto-generate UML PNG and PDF diagrams [skip ci]"
          git push